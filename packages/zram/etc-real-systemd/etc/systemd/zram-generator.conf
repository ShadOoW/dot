# zram-size was ram * 0.75 (23.3 GiB) until 2026-08-01. That caused the once-or-twice-daily
# hard freezes: zram stores compressed pages IN RAM (zspages), so under pressure the kernel
# had to allocate RAM in order to free RAM, and lost. See docs/zram.md "The 0.75 freeze".
# 0.25 then capped the zspages ceiling at ~3 GiB and let the prio-10 NVMe swapfile — which
# adds real capacity — take the overflow instead of sitting at 0B.
#
# 2026-09-03: raised 0.25 -> 0.375 (~11.7 GiB device, zspages ceiling ~4.5 GiB at the 2.6:1
# planning ratio; measured zstd ratio here is 3.7:1). The 7.8 GiB device sat at 81% full with
# 6 GiB spilled to NVMe in normal agent-heavy use. Safe to raise ONLY because the other three
# legs of the freeze fix are in place (min_free_kbytes=512M + watermark_scale_factor=200 give
# zsmalloc allocation headroom; zswap off removes the stacked allocate-to-reclaim step).
# earlyoom -S was rescaled in the same commit (packages/oom, derivation there) — the swap
# tier and the backstop must move together or earlyoom goes blind, freeze-era style.
# Keep in sync with etc-real-runit/etc/sv/zramen/conf and docs/zram.md.
[zram0]
zram-size = ram * 0.375
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
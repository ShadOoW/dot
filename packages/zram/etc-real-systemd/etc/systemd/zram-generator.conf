# zram-size was ram * 0.75 (23.3 GiB) until 2026-08-01. That caused the once-or-twice-daily
# hard freezes: zram stores compressed pages IN RAM (zspages), so under pressure the kernel
# had to allocate RAM in order to free RAM, and lost. See docs/zram.md "The 0.75 freeze".
# 0.25 caps the zspages ceiling at ~3 GiB and lets the prio-10 NVMe swapfile — which adds
# real capacity — actually take the overflow instead of sitting at 0B.
[zram0]
zram-size = ram * 0.25
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
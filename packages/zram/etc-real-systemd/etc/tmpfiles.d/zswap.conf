# Keep zswap off. It must never run in front of zram.
#
# zswap and zram are both compressed-anon-page caches, and stacking them means a page is
# compressed by zswap into a RAM pool, then on writeback decompressed and handed to zram,
# which compresses it AGAIN. Arch's zram page warns against the combination outright.
#
# This box shipped with it on by default and nobody noticed — linux-zen carries
# CONFIG_ZSWAP_DEFAULT_ON=y, and nothing in this repo turned it off. Measured 2026-08-05:
#
#   enabled=Y  compressor=zstd  max_pool_percent=20
#   Zswap: 721656 kB   Zswapped: 2247456 kB
#
# 2.1 GiB of anon pages held in a 705 MiB pool, with headroom to grow that pool to 20% of
# RAM (~6.4 GiB) — RAM spent to cache pages on their way to a device that would have
# compressed them anyway.
#
# The real problem is not the waste, it is that zswap reintroduces the exact hazard
# docs/zram.md identifies as the cause of the 2026-07/08 freezes: writeback out of the
# zswap pool has to ALLOCATE in order to free, in the reclaim path, under pressure. It is
# a fourth allocate-to-reclaim step bolted in front of zsmalloc's.
#
# It also kept earlyoom's trigger latched: pages freed by a kill do not return to
# MemAvailable promptly while they are sitting in the pool, so the memory condition stayed
# true and earlyoom kept killing (see packages/oom/.../10-args.conf).
#
# Belt and braces, on purpose. The authoritative switch is zswap.enabled=0 on the kernel
# cmdline, which applies before any swap device is touched — but GRUB is not managed by
# this repo (see docs/grub.md), so a bootloader change or a grub-mkconfig run without the
# param would silently re-enable it. This file is the repo-managed enforcement. systemd
# runs it at sysinit.target; the cmdline covers the window before that.
w- /sys/module/zswap/parameters/enabled - - - - N

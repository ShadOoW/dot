# Reclaim watermarks — the third leg of the 2026-08-01 freeze fix.
#
# The freezes were a zram reclaim livelock, not a plain OOM. To swap a page out, zram must
# ALLOCATE a page (zsmalloc) to hold the compressed copy. When free memory is already at the
# watermark that allocation fails, so the swap-out fails, so nothing is reclaimed, so kswapd
# spins. From the kernel's own dumps:
#
#   Jul 29 01:01:34  Normal free:14944kB  min:64308kB  zspages:2027248kB
#   Jul 29 01:01:39  Write-error on swap-device (252:0:...)      <- zram0, swap-out failing
#   Jul 29 02:40:25  kswapd0: page allocation failure, order:0   <- reclaim itself starved
#                    Normal free:12692kB  min:64308kB  zspages:3829832kB
#   Jul 30 23:01:20  Normal free:19540kB  min:64308kB  zspages:2815884kB
#
# Every failure carried mode 0xc0de0 (GFP_KERNEL|__GFP_HIGH|__GFP_ZERO|__GFP_COMP|
# __GFP_NOMEMALLOC) — the zsmalloc signature. Free swap was 27 GiB at the time, so neither
# the kernel OOM killer nor earlyoom fired; the machine simply stopped.
#
# min_free_kbytes: the default 67584 kB is a ~64 MiB reserve on a 31 GiB box. That is far
# too thin when a compressing swap device sits in the reclaim path and needs headroom to
# make forward progress. 524288 (512 MiB) gives zsmalloc's __GFP_HIGH allocations somewhere
# to land. Costs 512 MiB of never-allocated RAM; cheap against a daily hard lock.
vm.min_free_kbytes = 524288

# watermark_scale_factor: distance between the min/low/high watermarks, in units of 0.01% of
# a zone. The default 10 (0.1%) means kswapd wakes very late and direct reclaim — which
# stalls the allocating task — takes over almost immediately. 200 (2%) wakes kswapd far
# earlier so reclaim happens in the background instead of by stalling every allocator.
vm.watermark_scale_factor = 200

# swappiness 60 is the pre-zram default tuned for spinning disks. With zram at prio 100 and
# an NVMe swapfile behind it, anon pages are cheap to evict and page cache is expensive to
# refetch, so bias toward anon. Not the freeze fix — just stops the kernel throwing away
# executable page cache first and turning pressure into an I/O storm.
vm.swappiness = 100

# page-cluster 0 (read one page at a time) is already correct for zram; kept explicit so a
# distro default change cannot silently reintroduce readahead on a device with none.
vm.page-cluster = 0

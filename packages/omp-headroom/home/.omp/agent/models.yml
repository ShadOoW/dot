# omp's Anthropic traffic goes through the local headroom proxy, which compresses tool
# output before it reaches the API. A one-week trial from 2026-10-04: this package's README.md.
#
# A same-id override moves only the endpoint: omp keeps its bundled Anthropic models and the
# credentials it holds for provider `anthropic`. ANTHROPIC_BASE_URL is not the switch for omp;
# headroom's own omp integration documents that omp reads its chat endpoint from here.
#
# `/p/omp` is headroom's per-project prefix: the proxy strips it and files these requests
# under the project `omp`, apart from claude-work/claude-personal traffic on the same proxy.
#
# The proxy is the user unit `headroom-proxy` (egghead, hosts/desktop/default.nix).
# While it is down, every omp request fails. Off switch: `dot pkg omp-headroom unlink`, then
# restart omp.
providers:
  anthropic:
    baseUrl: http://127.0.0.1:8787/p/omp

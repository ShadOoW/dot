# No --use-gl here, on purpose. Chromium 150 (Vivaldi 8.1) dropped the native EGL/GLES2
# backend; --use-gl=egl resolves to (gl=egl-gles2, angle=none), which is no longer in the
# allowed set [(egl-angle,opengl), (egl-angle,opengles), (egl-angle,vulkan)]. GPU init then
# fails three times and Chromium disables the GPU entirely — the whole browser ends up on
# --use-gl=disabled with --disable-gpu-compositing on every renderer.
#
# That is not merely slow. Vivaldi's own UI (tab bar, panels, address bar) is a web page in
# an extension-process renderer, and its Compositor thread hits a CHECK in the software
# path after some hours: SIGILL -> vivaldi_ui_web_contents_delegate.cc "UI Process
# abnormally terminates with status 3" -> "Restarting Vivaldi". The window vanishes and
# relaunches. That was the mystery "Vivaldi keeps closing itself" (2026-07-29 13:18,
# 07-30 14:47, 08-01 18:13, 08-01 21:32).
#
# Omitting the flag lets Chromium auto-select egl-angle. To pin it explicitly, use
# --use-angle=gl (or =vulkan), never --use-gl=egl.
--ozone-platform-hint=auto
--enable-features=VaapiVideoDecodeLinuxGL,WebRTCPipeWireCapturer
--enable-gpu-rasterization

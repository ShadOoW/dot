## ----------------------------------------------------------------

#: Advanced {{{

# Force a login shell (argv[0] "-zsh") so .zprofile / .zprofile.d/* actually
# run. Kitty's default (non-login) shell silently skips them since zsh only
# sources .zprofile for login shells.
shell zsh -l
# editor .
# close_on_child_death no
# remote_control_password
allow_remote_control yes
listen_on unix:/tmp/kitty
# env VAR1=a
# env VAR2=${HOME}/${VAR1}/b
# watcher /path/to/python/file
# exe_search_path /path/to/bin
# update_check_interval 24
# startup_session none
# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask
# clipboard_max_size 512
# file_transfer_confirmation_bypass
# allow_hyperlinks yes
# shell_integration enabled
# allow_cloning ask
# clone_source_strategies venv,conda,env_var,path
# notify_on_cmd_finish never
# term xterm-kitty
# forward_stdio no
# menu_map global "Actions::Launch something special" launch --hold --type=os-window sh -c "echo hello world"

#: }}}

## ----------------------------------------------------------------

#: Keyboard shortcuts {{{

# Tab management
map ctrl+shift+t launch --type=tab --location=first --cwd=current
map alt+w close_tab

map alt+tab next_tab

# Paste from clipboard (will use paste_actions filter)
map ctrl+shift+v paste_from_clipboard

# Font size — runtime only, never writes fonts.conf, resets to configured
# size on restart. Handy when streaming (moonlight/sunshine) to the small
# MacBook Air screen: bump up for the session, restart resets on desktop.
map kitty_mod+equal change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0     change_font_size all 0

# One-key jump to a large preset for streaming, and back to default (0).
map kitty_mod+f2 change_font_size all 20
map kitty_mod+f1 change_font_size all 0

#: }}}


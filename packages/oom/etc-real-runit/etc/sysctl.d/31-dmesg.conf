# Let the OOM notifier read the kernel ring buffer. Void/runit only.
#
# Void ships kernel.dmesg_restrict=1, so `dmesg` is EPERM for anyone but root. ~/.local/bin/
# oom-notify runs as shad (it has to — notify-send needs the session D-Bus, and getting a root
# daemon onto that bus is the fragile thing the notifier exists to avoid), so with the
# restriction in place a *kernel* OOM kill produces no notification at all on Void. Arch has
# no equivalent problem: the journal exposes kernel messages to group wheel via the ACL on
# /var/log/journal, which is why this file is under etc-real-runit/ and not the shared tree.
#
# The security this gives up here is nil. shad is in `wheel` and therefore already has sudo,
# i.e. can read the buffer any time by asking. dmesg_restrict only stops *unprivileged
# automation* — which on this host means precisely the notifier and nothing else. It is not a
# barrier against the user; it is a barrier against the user's own tooling.
#
# 31- so it lands after packages/zram's 30-reclaim.conf; unrelated keys, ordered only to keep
# the two files adjacent and obviously co-owned.
kernel.dmesg_restrict = 0

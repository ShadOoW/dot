# Stop the kernel preferring your session manager over the apps that ate the RAM.
#
# Upstream systemd ships OOMScoreAdjust=100 on user@.service
# (/usr/lib/systemd/system/user@.service:35), reasoning that a user manager is restartable
# and therefore cheap to sacrifice. In practice that inverts the priority you want.
#
# 2026-07-28 17:33 is exactly that failure. Measured from the kernel's task dump:
#   node-MainThread  26 procs   8.5 GiB   adj=0      <- the actual hog
#   bun               5 procs   4.8 GiB   adj=0
#   claude            8 procs   2.5 GiB   adj=0
#   vivaldi-bin       6 procs   0.9 GiB   adj=200    <- sacrificial, and tiny
#   user@1000 systemd           trivial   adj=100    <- what the kernel killed
# The kernel first killed vivaldi's renderers (correct — chromium marks them adj=200/300),
# freed almost nothing because they were small, then escalated to the session manager. With
# no manager the session could not be reaped: session-c1.scope survived SIGKILL, shutdown
# hung 90s, and /home/shad/.cache failed to unmount.
#
# Put the manager on par with ordinary processes and let earlyoom pick the real hog.
[Service]
OOMScoreAdjust=0
MemoryMin=128M

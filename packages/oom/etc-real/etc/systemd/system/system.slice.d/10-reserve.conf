# Reserve a floor of memory that the kernel will NOT reclaim from system services, so the
# host stays usable (sshd, journald, dbus, the ops services) while userspace thrashes.
#
# MemoryMin is a hard cgroup-v2 protection: pages up to this amount are exempt from reclaim
# entirely, unlike MemoryLow which is only best-effort. 1G is deliberately modest — it
# covers the small always-on daemons you need to get back in and diagnose (sshd, journald,
# dbus-broker), not the big services like immich/postgres which can and should be reclaimed.
#
# This is the "the system itself never runs out of RAM" half of the setup. The other half is
# earlyoom, which kills a userspace hog before the kernel's blunt last-resort killer runs.
[Slice]
MemoryAccounting=yes
MemoryMin=1G

# earlyoom argv.
#
# Overriding ExecStart rather than writing /etc/default/earlyoom on purpose: systemd's
# EnvironmentFile does NOT do shell quote-removal, so `--avoid '^(a|b)$'` would hand the
# single quotes to earlyoom as part of the regex. Setting argv directly is unambiguous.
# (The regexes below deliberately contain no spaces, so no quoting is needed at all.)
#
# Why earlyoom and not systemd-oomd: sway is not launched by a systemd user session here,
# so every GUI app — kitty, claude, node, vivaldi — sits in ONE cgroup,
# user.slice/user-1000.slice/session-c1.scope, currently ~15.3 GiB. systemd-oomd kills at
# cgroup granularity, so its only available move is to kill that entire scope, i.e. log you
# out. earlyoom is process-granular and kills the single largest offender instead.
#
# Thresholds are on BOTH memory and swap: SIGTERM at 10% free, SIGKILL at 5%. With zram
# (23 GiB) plus the NVMe swapfile (16 GiB) behind it, this only fires under genuine
# exhaustion, and it fires while there is still RAM left to run the kill.
#
# --prefer lists what actually caused the 2026-07-28 OOM: node/bun/claude held ~15.8 GiB of
# the 26.8 GiB in use. --avoid keeps the session and system plumbing alive so a kill is
# survivable rather than a logout. Process names are matched against comm, max 15 chars —
# "node-MainThread" is exactly 15, "systemd-journal" is truncated from systemd-journald.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 10,5 -s 10,5 --avoid ^(systemd|sway|kitty|ly|ly-dm|Xwayland|mako|swaync|pipewire|pipewire-pulse|wireplumber|dbus-broker|sshd|systemd-journal|sudo|login)$ --prefer ^(node|node-MainThread|bun|claude|chromium|vivaldi-bin|electron|insomnia|iii)$

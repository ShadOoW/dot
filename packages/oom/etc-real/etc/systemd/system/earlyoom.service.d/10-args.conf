# earlyoom argv.
#
# Overriding ExecStart rather than writing /etc/default/earlyoom on purpose: systemd's
# EnvironmentFile does NOT do shell quote-removal, so `--avoid '^(a|b)$'` would hand the
# single quotes to earlyoom as part of the regex. Setting argv directly is unambiguous.
# (The regexes below deliberately contain no spaces, so no quoting is needed at all.)
#
# Why earlyoom and not systemd-oomd: sway is not launched by a systemd user session here,
# so every GUI app — kitty, claude, node, vivaldi — sits in ONE cgroup,
# user.slice/user-1000.slice/session-c1.scope, currently ~15.3 GiB. systemd-oomd kills at
# cgroup granularity, so its only available move is to kill that entire scope, i.e. log you
# out. earlyoom is process-granular and kills the single largest offender instead.
#
# ── 2026-08-05: -s 100 reverted, thresholds made absolute ────────────────────────────────
#
# The previous revision pinned the swap threshold at 100% to force the memory condition to
# stand alone, because earlyoom ANDs the two. That was correct for its time and is wrong now.
# It caused two runaway kill storms:
#
#   Aug 03 17:27-17:28   177 kills in two minutes
#   Aug 04 20:30         19 kills, with swap 73% FREE (18 of 24.3 GiB)
#
# Neither was an out-of-memory condition. The kernel OOM killer has not fired in weeks.
#
# Two things went wrong. First, the premise expired: the old comment cited "~39 GiB of swap
# advertised", from the era when zram was ram*0.75 (23 GiB). Swap is now 24.3 GiB of which
# 16 GiB is a real NVMe swapfile — actual capacity that genuinely absorbs pressure, so
# swap-free is once again a meaningful signal and the AND-gate is no longer dead weight.
#
# Second, and the reason a single trigger became a storm: VmRSS massively overstates what
# killing a Chromium-family process gives back, because renderers share most of their pages.
# Measured here, Vivaldi across 38 processes:
#
#   sum RSS = 10107 MiB      <- what earlyoom scores and reports
#   sum PSS =  5086 MiB      <- what a kill actually returns
#
# So earlyoom killed a "326 MiB" renderer, recovered ~160 MiB, stayed under the threshold,
# and killed again — 177 times. With -s 100 there was nothing left to break the loop. This
# is the same PSS-vs-RSS effect src/lib/memory.ts documents for `dot sgc`.
#
# -S restores the brake. 6 GiB free swap means zram is full and ~10 GiB of the NVMe swapfile
# is consumed; combined with <2.5 GiB available RAM that is a real emergency, not a busy
# afternoon. At the Aug 04 event swap was 18 GiB free, so this configuration would not have
# fired at all.
#
# ── Absolute sizes, not percentages ──────────────────────────────────────────────────────
#
# -m/-s take percentages of earlyoom's "user mem total", NOT MemTotal:
#
#   mem total: 31852 MiB, user mem total: 20162 MiB
#
# So the old `-m 10,5` fired at ~2.0/1.0 GiB, not the "~3.1 GiB of 31" the previous comment
# claimed. Worse, user-mem-total moves with unreclaimable kernel memory — the Aug 04 logs
# show it wandering 20555-21501 MiB — so the trigger point drifted under load, which is
# exactly when it must not. -M/-S are absolute KiB and hold still.
#
#   -M 2621440,1310720   SIGTERM at 2.5 GiB available, SIGKILL at 1.25 GiB
#   -S 6291456,3145728   SIGTERM at 6 GiB free swap,   SIGKILL at 3 GiB
#
# ── --prefer no longer lists the browsers ────────────────────────────────────────────────
#
# Chromium already sets oom_score_adj=300 on its own renderers, so they nominate themselves;
# the Aug 04 log shows them at oom_score 1170. Adding chromium/vivaldi-bin to --prefer
# multiplied that again and pinned earlyoom onto precisely the processes whose RSS overstates
# the win by 2x — it guaranteed the loop picked the least effective victim available. Dropping
# them lets earlyoom reach the big single-tenant heaps (node/claude/tsserver) where RSS ~ PSS
# and one kill actually clears the threshold. Browser renderers remain very killable via their
# own oom_score_adj; they just no longer outrank a 3 GiB tsserver.
#
# --avoid keeps the session and system plumbing alive so a kill is survivable rather than a
# logout. Process names are matched against comm, max 15 chars — "node-MainThread" is exactly
# 15, "systemd-journal" is truncated from systemd-journald.
#
# See docs/zram.md for the reclaim-livelock mechanism these thresholds coexist with, and
# packages/zram for the four mitigations (zram 0.25, min_free_kbytes, watermark_scale_factor,
# zswap off) that are the actual defense against it. earlyoom is the backstop, not the plan.
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -M 2621440,1310720 -S 6291456,3145728 --avoid ^(systemd|sway|kitty|ly|ly-dm|Xwayland|mako|swaync|pipewire|pipewire-pulse|wireplumber|dbus-broker|sshd|systemd-journal|sudo|login)$ --prefer ^(node|node-MainThread|bun|claude|electron|insomnia|iii)$

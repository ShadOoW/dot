# /etc/systemd/resolved.conf.d/dns.conf — managed by dot (packages/dns).
# Arch only. Owns systemd-resolved's upstream AND its coexistence with AdGuard.
# See docs/dns.md.
[Resolve]
# AdGuard Home (desktop-local, /data/ops/dns) is the active upstream, with public
# resolvers as failover. Routing resolved through AdGuard is what makes it safe to
# keep `resolve` in the nsswitch hosts line: nss-resolve answers first, but it answers
# *from AdGuard*, so blocking and the *.home.shadhq.com names still work.
#
# The bare `DNS=` / `FallbackDNS=` lines are load-bearing, not noise. DNS= in
# resolved.conf ACCUMULATES across the main file and every drop-in — it does not
# override. /etc/systemd/resolved.conf on this host carries a hand-added `DNS=9.9.9.9`
# (pacman -Qkk systemd confirms it is modified from stock), so this drop-in alone
# produced `DNS Servers: 9.9.9.9 127.0.0.1` — Quad9 first, AdGuard never consulted,
# i.e. exactly the bypass this file exists to prevent. Assigning the empty value
# resets the list, so what follows is genuinely authoritative no matter what the main
# file or a future .pacnew says. Verify with:
#   resolvectl status | grep 'DNS Servers'   # must be 127.0.0.1 alone
DNS=
DNS=127.0.0.1
FallbackDNS=
FallbackDNS=9.9.9.9 1.1.1.1

# AdGuard binds the WILDCARD :53. resolved's stub listener (127.0.0.53) collides with
# it on TCP ("address already in use") while UDP slips through via SO_REUSEADDR, so
# AdGuard crash-loops. The stub is therefore off and AdGuard owns :53.
#
# Two consequences, both handled by configure.sh — do not "fix" one without the other:
#   1. /etc/resolv.conf CANNOT point at the stub; it is a real file at 127.0.0.1
#      (files/resolv.conf.arch).
#   2. resolved must still be ENABLED. Disabling it to free :53 is the wrong lever —
#      the stub setting already did that — and it silently breaks the AWS VPN.
DNSStubListener=no

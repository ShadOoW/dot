# /etc/systemd/resolved.conf.d/dns.conf — managed by dot (packages/dns).
# Arch only. Sets systemd-resolved's upstream. See docs/dns.md.
[Resolve]
# AdGuard Home (desktop-local, /data/ops/dns) is the active upstream, with public
# resolvers as failover. This is authoritative — it overrides any DNS= in the main
# /etc/systemd/resolved.conf. resolv.conf stays pointed at the resolved stub
# (127.0.0.53), so glibc AND musl both go through resolved -> AdGuard, and the AWS
# VPN's per-link split-DNS still works.
DNS=127.0.0.1
FallbackDNS=9.9.9.9 1.1.1.1

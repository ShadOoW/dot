# /etc/systemd/resolved.conf.d/dns.conf — managed by dot (packages/dns).
# Arch only. Sets systemd-resolved's upstream. See docs/dns.md.
[Resolve]
# Active upstream: Quad9 (verified working). This is authoritative — it overrides
# any DNS= in the main /etc/systemd/resolved.conf.
DNS=9.9.9.9
FallbackDNS=1.1.1.1 8.8.8.8

# --- AdGuard Home (desktop-local resolver on 127.0.0.1) ---
# AdGuard is not enabled yet (see /data/ops/dns). Once it is up and answering on
# 127.0.0.1:53, route everything through it (with Quad9 as failover) by changing
# the DNS= line above to:
#     DNS=127.0.0.1 9.9.9.9
# then: sudo systemctl restart systemd-resolved
# resolv.conf stays pointed at the resolved stub (127.0.0.53), so glibc AND musl
# both go through resolved -> AdGuard, and the VPN's per-link split-DNS still works.

# /etc/dhcpcd.conf — managed by dot (packages/dns). See docs/dns.md.
# Installed as a REAL file by configure.sh (NOT a symlink into the repo): a
# dangling symlink into a moved/absent dotfiles tree is exactly what broke DNS
# after a restore.

# Standard dhcpcd defaults
hostname
duid
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
noipv4ll

# --- DNS ownership (the important part) ---
# Do NOT let dhcpcd manage /etc/resolv.conf. On this network the router (MikroTik)
# hands out NO DNS server over DHCP — DNS is provided locally (systemd-resolved on
# Arch, a static resolv.conf on Void). Without this line, dhcpcd's resolv.conf hook
# writes an EMPTY resolv.conf on every lease event, which breaks every musl / c-ares
# resolver that reads /etc/resolv.conf directly (the bundled AWS openvpn, Claude
# Code's runtime, node dns.resolve*, …) with getaddrinfo timeouts, while glibc's
# nss-resolve path keeps working — the confusing "split brain". See docs/dns.md.
nohook resolv.conf

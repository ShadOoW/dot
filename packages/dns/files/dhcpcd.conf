# /etc/dhcpcd.conf — managed by dot (packages/dns). See docs/dns.md.
# Installed as a REAL file by configure.sh (NOT a symlink into the repo): a
# dangling symlink into a moved/absent dotfiles tree is exactly what broke DNS
# after a restore.

# Standard dhcpcd defaults
hostname

# --- DHCP identity: one explicit HOST client-id, not per-NIC and not a DUID ---
# The router pins `192.168.88.10` with a **client-id-matched** static lease, because this
# desktop reaches the LAN over EITHER NIC — `enp3s0` (04:7C:16:59:58:77, wired into an
# ether2-5 LAN port since the Nokia cable moved to the router's ether1 in step 15) or
# `wlan0` (2C:33:58:12:20:B4). RouterOS allows only ONE static lease per address and a
# lease matches a single MAC, so a MAC-pinned `.10` can only ever follow one NIC: plug the
# cable in and the desktop falls through to a dynamic pool address. Matching on a client-id
# that identifies the HOST rather than the interface is what makes `.10` link-agnostic.
#
# The value is 0x00 + "saykuk" (type byte 0 = not a hardware address, per RFC 2132). The
# router's lease stores the match as client-id="0:73:61:79:6b:75:6b"; a bound lease then
# displays the observed option as active-client-id="saykuk" next to whichever NIC's MAC is
# carrying it. Keep this line byte-identical in the Void root's copy — /etc is
# per-root-filesystem, so a Void boot without it presents a different identity and silently
# loses `.10`.
#
# Two things it must NOT be:
#
#   `duid` (the stock default) generates a DUID-LLT (link-layer address + a CREATION
#   TIMESTAMP) and persists it in /var/db/dhcpcd/duid, which is per-root-filesystem. Each
#   OS invents its own, so the router sees TWO DIFFERENT CLIENTS behind one MAC and the boot
#   that did not create the lease falls through to a dynamic address. Measured 2026-08-08:
#
#     0    address=192.168.88.10  mac=2C:33:58:12:20:B4  (static, bound, last-seen 12h)
#          client-id="ff:58:12:20:b4:0:1:0:1:2f:b6:2:66:52:df:f7:1d:3a:a2"   <- Arch
#     1  D address=192.168.88.16  mac=2C:33:58:12:20:B4  (dynamic, last-seen 9m)
#          client-id="ff:58:12:20:b4:0:1:0:1:31:76:b8:6e:2c:33:58:12:20:b4"  <- Void
#
#   `clientid ""` (what this file used to say) was believed to send "a default clientid of
#   the hardware family and the hardware address … i.e. 01:<mac>" per dhcpcd.conf(5). It
#   does not: measured on the router 2026-08-24, an empty string sends a single 0x00 byte —
#   the wlan0 and enp3s0 leases both read client-id="0". It happened to be host-wide — why the
#   wired NIC could be rescued at all — but it was an accident of the config parser, not a
#   decision, and a dhcpcd upgrade that "fixed" it to 01:<mac> would silently drop `.10`.
#
# That is not cosmetic. .10 is the address AdGuard is reachable at, the address the
# router hands every LAN client as `dns-server=192.168.88.10`, and the address every
# `*.home.shadhq.com` AdGuard rewrite points to. On a Void boot the desktop did not hold
# it, so LAN-wide DNS silently fell back to the router and every `.home` name went
# nowhere — including from this box itself.
#
# ⚠ One LAN link at a time. Both NICs present this identity, so if the cable AND Wi-Fi are
# up together the router hands `.10` to both and the host ends up with the same address on
# two interfaces in one subnet. Keep Wi-Fi disconnected while cabled.
clientid 00:73:61:79:6b:75:6b
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
noipv4ll

# --- hands off every interface this host does not get a DHCP lease on ---
# dhcpcd manages EVERY interface it finds unless told otherwise, and that is not harmless
# here: it adopted tailscaled's tunnel address as its own and then deconfigured it, taking
# the desktop's tailnet IPv4 with it. From the journal:
#
#   Aug 23 13:54:41 dhcpcd: tailscale0: using static address 100.64.0.1/32
#   Aug 23 13:56:27 dhcpcd: tailscale0: waiting for 3rd party to configure IP address
#
# After the second line `ip addr show tailscale0` carries only the IPv6 /128 while
# `tailscale status` still reports 100.64.0.1 — the daemon and the kernel disagree, and a
# socket stays bound to an address the host no longer has. Everything that reaches this box
# over the tailnet then breaks while the LAN path keeps working, which is a confusing shape
# to debug: headscale's extra_records map every *.home.shadhq.com to A 100.64.0.1
# (/data/ops/headscale/extra-records.json), so with the tailnet up a phone resolves those
# names to an address that answers nothing, and DISCONNECTING the tailnet "fixes" it by
# falling back to the AdGuard rewrite -> 192.168.88.10.
#
# tailscaled, docker and podman all configure their own interfaces; dhcpcd must never touch
# them. Deny the virtual families rather than allow-listing enp3s0/wlan0, so a genuinely new
# NIC (USB tether, dock) still gets a lease without editing this file.
denyinterfaces tailscale0 wg* docker* br-* veth* tap* podman* cni* virbr*

# --- DNS ownership (the important part) ---
# Do NOT let dhcpcd manage /etc/resolv.conf. On this network the router (MikroTik)
# hands out NO DNS server over DHCP — DNS is provided locally (systemd-resolved on
# Arch, a static resolv.conf on Void). Without this line, dhcpcd's resolv.conf hook
# writes an EMPTY resolv.conf on every lease event, which breaks every musl / c-ares
# resolver that reads /etc/resolv.conf directly (the bundled AWS openvpn, Claude
# Code's runtime, node dns.resolve*, …) with getaddrinfo timeouts, while glibc's
# nss-resolve path keeps working — the confusing "split brain". See docs/dns.md.
nohook resolv.conf

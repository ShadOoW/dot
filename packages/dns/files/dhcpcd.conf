# /etc/dhcpcd.conf — managed by dot (packages/dns). See docs/dns.md.
# Installed as a REAL file by configure.sh (NOT a symlink into the repo): a
# dangling symlink into a moved/absent dotfiles tree is exactly what broke DNS
# after a restore.

# Standard dhcpcd defaults
hostname

# --- DHCP identity: MAC-based, NOT a DUID (this desktop dual-boots) ---
# `clientid ""` makes dhcpcd send "a default clientid of the hardware family and the
# hardware address" (dhcpcd.conf(5)) — i.e. 01:<mac>, identical under Arch and Void.
#
# The stock `duid` does the opposite: it generates a DUID-LLT (link-layer address + a
# CREATION TIMESTAMP) and persists it in /var/db/dhcpcd/duid, which is per-root-filesystem.
# So each OS invents its own DUID and the router sees TWO DIFFERENT CLIENTS behind one MAC.
# RouterOS then matches its static lease on client-id, and the boot that did not create it
# falls through to a dynamic address. Measured on the router 2026-08-08:
#
#   0    address=192.168.88.10  mac=2C:33:58:12:20:B4  (static, bound, last-seen 12h)
#        client-id="ff:58:12:20:b4:0:1:0:1:2f:b6:2:66:52:df:f7:1d:3a:a2"   <- Arch
#   1  D address=192.168.88.16  mac=2C:33:58:12:20:B4  (dynamic, last-seen 9m)
#        client-id="ff:58:12:20:b4:0:1:0:1:31:76:b8:6e:2c:33:58:12:20:b4"  <- Void
#
# That is not cosmetic. .10 is the address AdGuard is reachable at, the address the
# router hands every LAN client as `dns-server=192.168.88.10`, and the address every
# `*.home.shadhq.com` AdGuard rewrite points to. On a Void boot the desktop did not hold
# it, so LAN-wide DNS silently fell back to the router and every `.home` name went
# nowhere — including from this box itself.
clientid ""
persistent
vendorclassid
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu
require dhcp_server_identifier
slaac private
noipv4ll

# --- DNS ownership (the important part) ---
# Do NOT let dhcpcd manage /etc/resolv.conf. On this network the router (MikroTik)
# hands out NO DNS server over DHCP — DNS is provided locally (systemd-resolved on
# Arch, a static resolv.conf on Void). Without this line, dhcpcd's resolv.conf hook
# writes an EMPTY resolv.conf on every lease event, which breaks every musl / c-ares
# resolver that reads /etc/resolv.conf directly (the bundled AWS openvpn, Claude
# Code's runtime, node dns.resolve*, …) with getaddrinfo timeouts, while glibc's
# nss-resolve path keeps working — the confusing "split brain". See docs/dns.md.
nohook resolv.conf

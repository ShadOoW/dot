# Uncapped, journald defaults to min(10% of the filesystem, 4G). /var is a 489G XFS
# partition, so that meant a hard 4G — and the journal duly sat at 4.1G.
#
# A drop-in rather than editing journald.conf directly, so a pending journald.conf.pacnew
# merge cannot silently revert it.
[Journal]
SystemMaxUse=1G
SystemKeepFree=2G
SystemMaxFileSize=128M
MaxRetentionSec=1month
